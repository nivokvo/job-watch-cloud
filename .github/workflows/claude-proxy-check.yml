name: claude-proxy-check
# Проверка без побочных эффектов: поднимает тот же прокси, что cloud-apply/cloud-chats, и смотрит страну для API Claude.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Claude proxy
        env:
          XRAY_CLIENT_JSON: ${{ secrets.XRAY_CLIENT_JSON }}
        run: bash cloud_apply/vps_proxy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Один запрос к Claude через прокси (токен из секрета)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g -s @anthropic-ai/claude-code
          export HTTPS_PROXY="$CLAUDE_HTTPS_PROXY" HTTP_PROXY="$CLAUDE_HTTPS_PROXY" NO_PROXY=localhost,127.0.0.1
          out=$(echo "Ответь одним словом: ok" | claude -p --model haiku --tools "" --setting-sources "" --no-session-persistence 2>&1 || true)
          # в публичный лог — только итог, без текста ошибок
          if printf '%s' "$out" | grep -qi '^ *ok'; then echo "Claude ответил через прокси: ok"; else echo "Claude не ответил (код ошибки скрыт)"; exit 1; fi
      - name: Без прокси Claude не зовётся
        run: |
          python3 - <<'P'
          import os, sys
          os.environ["RABOTA_STATE_FILE"] = "/dev/null"
          os.environ.pop("CLAUDE_HTTPS_PROXY", None)
          sys.path.insert(0, "cloud_apply")
          import replier
          try:
              replier.claude("x", "x")
              sys.exit("ошибка: claude вызван без прокси")
          except RuntimeError as e:
              print("ок:", e)
          P
